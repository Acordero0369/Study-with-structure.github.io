name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      # ----------------------------------------------------------------
      # Optional: fetch content from another repository.
      # Set EXTERNAL_REPO to the full repository URL (HTTPS) you want
      # to include, e.g. https://github.com/owner/repo.git
      # Leave blank to skip this step.
      # ----------------------------------------------------------------
      - name: Fetch content from external repository
        env:
          EXTERNAL_REPO: ""   # <-- replace with your repository URL
        run: |
          if [ -n "$EXTERNAL_REPO" ]; then
            echo "Cloning external repository: $EXTERNAL_REPO"
            git clone --depth 1 "$EXTERNAL_REPO" /tmp/external-repo
            mkdir -p external
            cp -r /tmp/external-repo/. external/
            # Remove the .git folder so it is not published
            rm -rf external/.git
            echo "External content copied to ./external/"
          else
            echo "No external repository configured. Skipping."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
